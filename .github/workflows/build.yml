name: SailfishOS build

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - master

env:
  RELEASE: 4.6.0.13
  BLOCKY_VERSION: 0.35.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Prepare
      run: mkdir RPMS

    - name: Build armv7hl
      id: build_armv7hl
      run: docker run --rm --privileged -v $PWD:/workspace coderus/sailfishos-platform-sdk:$RELEASE /bin/bash -c "
            mkdir -p build ;
            cd build ;
            cp -r /workspace/* . ;
            cd rpm ;
            curl -OL https://github.com/0xERR0R/blocky/releases/download/v${BLOCKY_VERSION}/blocky_v${BLOCKY_VERSION}_Linux_armv7.tar.gz ;
            cd .. ;
            mb2 -t SailfishOS-$RELEASE-armv7hl build --prepare ;
            sudo mkdir -p /workspace/RPMS ;
            sudo cp -r RPMS/*.rpm /workspace/RPMS"

    - name: Build aarch64
      id: build_aarch64
      run: docker run --rm --privileged -v $PWD:/workspace coderus/sailfishos-platform-sdk:$RELEASE /bin/bash -c "
            mkdir -p build ;
            cd build ;
            cp -r /workspace/* . ;
            cd rpm ;
            curl -OL https://github.com/0xERR0R/blocky/releases/download/v${BLOCKY_VERSION}/blocky_v${BLOCKY_VERSION}_Linux_arm64.tar.gz ;
            cd .. ;
            mb2 -t SailfishOS-$RELEASE-aarch64 build --prepare ;
            sudo mkdir -p /workspace/RPMS ;
            sudo cp -r RPMS/*.rpm /workspace/RPMS"

    - name: Upload build result
      uses: actions/upload-artifact@v5
      with:
        name: rpms
        path: RPMS

  publish:
      name: Publish the release
      needs: build
      if: github.ref_type == 'tag'
      runs-on: ubuntu-latest
      permissions:
        contents: write      # create the release
        id-token: write      # sign the build attestation
        attestations: write  # store it, so Harpoon can verify its own updates
      steps:
        - uses: actions/checkout@v6

        - uses: actions/download-artifact@v8
          with:
            path: RPMS
            merge-multiple: true

        - name: Checksums
          run: |
            cd RPMS
            sha256sum *.rpm > SHA256SUMS
            cat SHA256SUMS

        - uses: actions/attest-build-provenance@v2
          with:
            subject-path: RPMS/*.rpm

        - name: Release notes
          run: |
            awk 'NR > 1 && /^\*/ { exit } NR > 1' rpm/harbour-blocky.changes > notes.md
            cat notes.md

        - name: Create the release
          env:
            GH_TOKEN: ${{ github.token }}
          run: |
            prerelease=
            case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
            if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
              # A re-run replaces the release's files.
              gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' |
                while read -r asset; do gh release delete-asset "$GITHUB_REF_NAME" "$asset" -y; done
              gh release upload "$GITHUB_REF_NAME" RPMS/*.rpm RPMS/SHA256SUMS
              gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            else
              gh release create "$GITHUB_REF_NAME" RPMS/*.rpm RPMS/SHA256SUMS \
                --title "harbour-Blocky $GITHUB_REF_NAME" --notes-file notes.md --verify-tag $prerelease
            fi
